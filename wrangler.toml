name = "clash-config"
main = "src/index.js"
compatibility_date = "2026-09-01"

# 可选环境变量。上游地址一律由请求的 ?url= 带入，这里不需要配
[vars]
# SUB_TTL = "0"          # 短地址有效期（天），0 表示不过期

# ACCESS_KEY 是密钥，不要写在这里，用下面的命令写入：
#   wrangler secret put ACCESS_KEY
# 本地 `wrangler dev` 不读线上 secret，另需一份 .dev.vars（已被 .gitignore 忽略）

# 短地址功能需要 KV：
#   wrangler kv namespace create SUB_KV
# 若要换到自己的另一个 namespace，替换下面的 id 后重新 deploy。
[[kv_namespaces]]
binding = "SUB_KV"
id = "51c4728d626f4cffa5407c7d99933a31"
